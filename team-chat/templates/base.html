<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
(function () {
  var t = localStorage.getItem('theme');
  if (t === 'light' || t === 'dark') {
    document.documentElement.setAttribute('data-theme', t);
  }
})();
</script>
<title>{% block title %}내부망 팀 채팅{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
{% block head %}{% endblock %}
</head>
<body data-nickname="{{ nickname|default('') }}">
<script src="{{ url_for('static', filename='js/vendor/socket.io.min.js') }}"></script>
<script src="{{ url_for('static', filename='js/notify.js') }}"></script>
<script src="{{ url_for('static', filename='js/scrollbars.js') }}"></script>
{% if nickname %}
<button type="button" id="sidebar-toggle" class="sidebar-toggle-btn" aria-label="사이드바 토글">&#9776;</button>
<div id="sidebar-backdrop" class="sidebar-backdrop" hidden></div>
<aside id="sidebar" class="sidebar">
  <div class="sidebar-brand">TEAM CHAT</div>
  <nav class="sidebar-nav">
    <a class="sidebar-link {{ 'active' if request.endpoint in ('pages.rooms_page', 'pages.chat_page') else '' }}"
       href="{{ url_for('pages.rooms_page') }}">
      채팅
      <span class="badge-count" id="sidebar-unread-badge" data-count="{{ sidebar_unread_total|default(0) }}" {% if not sidebar_unread_total %}hidden{% endif %}>{{ sidebar_unread_total|default(0) }}</span>
    </a>
    <a class="sidebar-link {{ 'active' if request.endpoint == 'pages.excel_page' else '' }}"
       href="{{ url_for('pages.excel_page') }}">엑셀 변환</a>
    <a class="sidebar-link {{ 'active' if request.endpoint == 'pages.defect_page' else '' }}"
       href="{{ url_for('pages.defect_page') }}">이슈 공유</a>
    {% if is_admin %}
    <a class="sidebar-link {{ 'active' if request.endpoint == 'pages.admin_page' else '' }}"
       href="{{ url_for('pages.admin_page') }}">관리자</a>
    {% endif %}
  </nav>
  <button type="button" id="theme-toggle" class="sidebar-theme-toggle">🌙 다크모드</button>
</aside>
<script src="{{ url_for('static', filename='js/sidebar.js') }}"></script>
<script src="{{ url_for('static', filename='js/theme.js') }}"></script>
{% endif %}
<div class="app-content">
{% block body %}{% endblock %}
</div>

<!-- 삭제 등 위험한 동작 확인용 공용 모달. 네이티브 confirm()/prompt()은 데스크톱(Electron)
     앱에서 대화상자를 닫은 뒤 렌더러 입력이 먹통이 되는 경우가 있어, 모든 삭제 확인은
     이 테마 모달을 쓴다(confirm-modal.js). -->
<div id="confirm-modal" class="modal-overlay" hidden>
  <div class="modal">
    <div class="modal-header">
      <h2 id="confirm-modal-title">확인</h2>
    </div>
    <div class="modal-body">
      <p id="confirm-modal-message"></p>
      <div class="modal-actions">
        <span class="spacer"></span>
        <button type="button" class="btn-ghost" id="confirm-modal-cancel">취소</button>
        <button type="button" class="btn-danger" id="confirm-modal-ok">확인</button>
      </div>
    </div>
  </div>
</div>
<script src="{{ url_for('static', filename='js/confirm-modal.js') }}"></script>
</body>
</html>
